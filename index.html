<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-bottom) on the
         mobile bottom bar and enquiry sheet. Do not remove. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <title>Magical Hoop Art — Hand-embroidered hoop art, made to order</title>
    <meta
      name="description"
      content="Hand-embroidered hoop art for the moments you want to keep — anniversaries, first names, calendar dates. Made to order and shipped world-wide."
    />

    <!-- Link preview. %SITE_URL% is substituted at build time from
         VITE_SITE_URL — see vite.config.ts. Open Graph requires absolute URLs,
         so a relative path here would leave most crawlers with no image. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Magical Hoop Art" />
    <meta property="og:locale" content="en_AU" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Magical Hoop Art — Stories stitched into a frame" />
    <meta
      property="og:description"
      content="Hand-embroidered hoop art, made to order and shipped world-wide. Wedding and calendar hoops, names, photo frames and more."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Magical Hoop Art — a hand-embroidered hoop with a floral wreath around the words ‘magical hoopart’."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Magical Hoop Art — Stories stitched into a frame" />
    <meta
      name="twitter:description"
      content="Hand-embroidered hoop art, made to order and shipped world-wide."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500&family=Parisienne&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
